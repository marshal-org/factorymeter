name: factorymeter
description: Measure your delivery line station by station, split by agent and human pull requests, and name the station where work waits.
author: Marshal
branding:
  icon: activity
  color: gray-dark

# This action only reads. It needs these permissions on the calling job, and
# nothing else:
#
#   permissions:
#     contents: read
#     pull-requests: read
#     issues: read
#     actions: read
#     deployments: read
#
# The report goes to the job summary and to a build artifact. The store, which
# is what makes the next run quick, goes to a second build artifact of the same
# repository. Nothing is sent anywhere except to the GitHub API and, when you
# give a Linear key, to the Linear API, and when you give a Jira site and an
# account, to that Jira site.

inputs:
  target:
    description: owner/repo for one repository, or an owner for all of its active repositories. An owner needs a token that can read those repositories. Empty takes the target of the config file, else the repository the workflow runs in.
    required: false
    default: ""
  config:
    description: "A config file to read, such as .github/factorymeter.yml. Empty reads the factorymeter.yml, .factorymeter.yml or .github/factorymeter.yml of the checkout, when the job checked the repository out. An input wins over the file. The file never holds a key: those stay inputs from secrets."
    required: false
    default: ""
  since:
    description: "The window the report covers, in whole weeks: 13w or 26w. Empty takes the window of the config file, else 13w."
    required: false
    default: ""
  history:
    description: "How far back the first run reads: weeks (26w), days (180d) or a date (2026-01-31). The report compares the window with the one before it, so give at least twice the window. Empty takes the history of the config file, else 26w."
    required: false
    default: ""
  token:
    description: A token that can read the target. The job's own token is enough for the repository the workflow runs in.
    required: false
    default: ${{ github.token }}
  linear-api-key:
    description: A Linear personal API key that can read the workspace. With it the tickets of Linear are read too, and the spec station is measured from them. Pass it from a secret. In a public repository the report is then written without names, and the store is not kept.
    required: false
    default: ""
  linear-teams:
    description: "The keys of the Linear teams to read, separated by commas or spaces: ENG, OPS. Empty reads every team the key can see."
    required: false
    default: ""
  jira-site:
    description: "The host of a Jira Cloud site: acme.atlassian.net. With it, jira-email and jira-api-token, the tickets of the site are read too, and the spec station is measured from them. In a public repository the report is then written without names, and the store is not kept."
    required: false
    default: ""
  jira-email:
    description: The email of the Jira account the API token belongs to. Pass it from a secret.
    required: false
    default: ""
  jira-api-token:
    description: An API token of a Jira account that can read the site. Pass it from a secret.
    required: false
    default: ""
  jira-projects:
    description: "The keys of the Jira projects to read, separated by commas or spaces: ENG, OPS. Empty reads every project the account can see."
    required: false
    default: ""
  summary:
    description: Write the report to the job summary.
    required: false
    default: "true"
  artifact:
    description: Upload the HTML page, the JSON export and the Markdown report as a build artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the build artifact that holds the report.
    required: false
    default: factorymeter-report
  store:
    description: Keep the store between runs as a build artifact, so a run reads only what changed since the one before. With false, every run reads the whole history and nothing is kept.
    required: false
    default: "true"
  store-artifact-name:
    description: Name of the build artifact that holds the store. The owner of the target is added to it.
    required: false
    default: factorymeter-store

outputs:
  headline:
    description: The one-sentence result.
    value: ${{ steps.report.outputs.headline }}
  constraint:
    description: The station that holds the most of the hours changes spend on the line, such as review or release. Empty when the window has too little to name one.
    value: ${{ steps.report.outputs.constraint }}
  constraint-share:
    description: The share of those hours the constraint holds, from 0 to 1.
    value: ${{ steps.report.outputs.constraint-share }}
  agent-share:
    description: The share of the changes merged by agents and people that an agent wrote, from 0 to 1. A floor. Empty when nothing merged.
    value: ${{ steps.report.outputs.agent-share }}
  recommendation:
    description: The title of the first recommendation, or empty when there is none.
    value: ${{ steps.report.outputs.recommendation }}
  restored:
    description: Whether the run started from the store of an earlier run, true or false.
    value: ${{ steps.restore.outputs.restored }}
  requests:
    description: The number of requests the sync made to GitHub.
    value: ${{ steps.sync.outputs.requests }}
  html:
    description: Path of the one-page HTML report on the runner.
    value: ${{ steps.report.outputs.html }}
  json:
    description: Path of the factorymeter/v1 JSON export on the runner.
    value: ${{ steps.report.outputs.json }}
  markdown:
    description: Path of the Markdown report on the runner.
    value: ${{ steps.report.outputs.markdown }}
  store:
    description: Path of the store on the runner.
    value: ${{ steps.report.outputs.store }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    # The binary is built from the exact commit the workflow pinned, so the
    # code that runs is the code you can read.
    - name: Build factorymeter
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        FM_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="$(printf '%s' "${FM_REF#v}" | tr -cd 'A-Za-z0-9._-')"
        CGO_ENABLED=0 go build -trimpath \
          -ldflags "-s -w -X main.version=${version:-dev}" \
          -o "$RUNNER_TEMP/factorymeter" ./cmd/factorymeter

    # Every step below runs scripts/action.sh. Inputs reach it through the
    # environment, never through the script text, so an input cannot run as
    # shell.

    # The store comes from an artifact of this repository, so this step uses
    # the job's own token. The token input is for the target and stays out.
    - name: Restore the store
      id: restore
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FM_TARGET: ${{ inputs.target }}
        FM_CONFIG: ${{ inputs.config }}
        FM_STORE: ${{ inputs.store }}
        FM_STORE_NAME: ${{ inputs.store-artifact-name }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh" restore

    - name: Sync
      id: sync
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        FM_TARGET: ${{ inputs.target }}
        FM_CONFIG: ${{ inputs.config }}
        FM_HISTORY: ${{ inputs.history }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        FM_LINEAR_TEAMS: ${{ inputs.linear-teams }}
        FM_JIRA_SITE: ${{ inputs.jira-site }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        FM_JIRA_PROJECTS: ${{ inputs.jira-projects }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh" sync

    # Runs after a sync that failed or was stopped too. Such a sync keeps what
    # it stored, and the next run goes on from there.
    - name: Decide what may leave the runner
      id: share
      if: always()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FM_TARGET: ${{ inputs.target }}
        FM_CONFIG: ${{ inputs.config }}
        FM_STORE: ${{ inputs.store }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh" share

    - name: Report
      id: report
      shell: bash
      env:
        FM_TARGET: ${{ inputs.target }}
        FM_CONFIG: ${{ inputs.config }}
        FM_SINCE: ${{ inputs.since }}
        FM_SUMMARY: ${{ inputs.summary }}
        FM_NAMES: ${{ steps.share.outputs.names }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh" report

    - name: Upload the report
      if: inputs.artifact == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/factorymeter-report/factorymeter.html
          ${{ runner.temp }}/factorymeter-report/factorymeter.json
          ${{ runner.temp }}/factorymeter-report/factorymeter.md
        if-no-files-found: error

    - name: Save the store
      if: always() && steps.share.outputs.save == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.restore.outputs.name }}
        path: |
          ${{ runner.temp }}/factorymeter-store
          !${{ runner.temp }}/factorymeter-store/store.lock
        if-no-files-found: error
