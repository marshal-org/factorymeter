name: factorymeter

# Measures this repository with the Action in this repository, once a week
# and on demand. The report is in the job summary and in a build artifact. The
# store is in a second build artifact, and the next run starts from it.
#
# Read permissions only. This workflow cannot change anything.

on:
  schedule:
    - cron: "27 12 * * 3" # Wednesdays, 12:27 UTC
  workflow_dispatch:
    inputs:
      target:
        description: owner/repo to measure. Leave empty for this repository.
        required: false
        type: string
      since:
        description: The window in whole weeks, such as 13w or 26w.
        required: false
        default: 13w
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  deployments: read

concurrency:
  group: factorymeter
  cancel-in-progress: false

jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./
        id: fm
        with:
          target: ${{ inputs.target || github.repository }}
          since: ${{ inputs.since || '13w' }}
      - name: Headline
        env:
          HEADLINE: ${{ steps.fm.outputs.headline }}
          CONSTRAINT: ${{ steps.fm.outputs.constraint }}
          RESTORED: ${{ steps.fm.outputs.restored }}
          REQUESTS: ${{ steps.fm.outputs.requests }}
        run: |
          echo "headline: $HEADLINE"
          echo "constraint: ${CONSTRAINT:-none}"
          echo "started from a saved store: $RESTORED"
          echo "requests to GitHub: $REQUESTS"
