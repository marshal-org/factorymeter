name: factorymeter

# Measures this repository with the Action in this repository, once a week
# and on demand. The report is in the job summary and in the build artifact.
#
# Read permissions only. This workflow cannot change anything.

on:
  schedule:
    - cron: "27 12 * * 3" # Wednesdays, 12:27 UTC
  workflow_dispatch:
    inputs:
      target:
        description: owner/repo to measure. Leave empty for this repository.
        required: false
        type: string
      since:
        description: Start of the window, such as 30d or 12w.
        required: false
        default: 30d
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

concurrency:
  group: factorymeter
  cancel-in-progress: false

jobs:
  report:
    name: Report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./
        id: fm
        with:
          target: ${{ inputs.target || github.repository }}
          since: ${{ inputs.since || '30d' }}
      - name: Headline
        env:
          HEADLINE: ${{ steps.fm.outputs.headline }}
          CONSTRAINT: ${{ steps.fm.outputs.constraint }}
        run: |
          echo "headline: $HEADLINE"
          echo "constraint: ${CONSTRAINT:-none}"
